    <!-- ============================================================
         ESSAY HEADER
         EDIT ME: C-01 is the catalog number, Costumes the category
         name, and the paragraph below is a one-line note on how this
         category fits your theoretical framework/methodology.
         ============================================================ -->
    <section class="essay-header">
      <div class="container">
        <span class="essay-header__eyebrow">Catalog C-01 · Photo Essay</span>
        <h1>Costumes</h1>
        <p class="essay-header__byline">
          By <span class="essay-header__byline-author">[Author Name]</span> · <time>[date]</time>
        </p>
      </div>
    </section>

    <!-- ============================================================
         ESSAY BODY — one flowing, sequential list of figures: photo
         on top, caption + field note directly underneath, then the
         next figure below that. Order top-to-bottom IS the narrative
         order (Fig. 1 first, Fig. 6 last). Duplicate one
         <figure class="essay-figure">...</figure> block to add more.
         ============================================================ -->
    <section class="essay">
      <div class="container essay-sequence">

        <figure class="essay-figure">
          <img src="Images/Costume_Photo1.JPG" alt="Placeholder photo 1 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 1 — C-01.1 · [location / date]</span>
            <p class="essay-figure__note">
              With the many fans that come across Seattle, it's easy to get lost in
              a sea of jerseys, however all these strangers have in common: none of
              the people are simply wearing team colors. They're in costume, and
              yes, it matters. While a jersey simply identifies, a costume argues.
            </p>
            <p class="essay-figure__note">
              That is where costumery, social identity theory, and symbolic
              interactionism converge. Analyzing costumery during the 2026 World
              Cup through a theoretical lens helps explain why someone reaches for
              a national symbol at all, which is to secure a positive, distinct
              group membership.
            </p>
            <p class="essay-figure__note">
              However, costume is the mechanism by which that membership becomes
              visible, and performable on a crowded Seattle street. It's one thing
              to say that you're a big fan, but to wear it means something
              different entirely.
            </p>
            <p class="essay-figure__note">
              A costume is a symbol worn rather than spoken, and its meaning exists
              once someone else reads it and responds: a nod, a photo request, a
              greeting. Fandom in this sense isn't simply belonging; it's a
              costuming practice, a discourse over how visible one's identity claim
              should be.
            </p>
          </figcaption>
        </figure>

        <figure class="essay-figure">
          <img src="Images/Costume_Photo2.JPG" alt="Placeholder photo 2 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 2 — C-01.2 · [location / date]</span>
            <p class="essay-figure__note">
              Two men, one beared as Abraham Lincoln in his famous top hat, and the
              other in a colonial wig and vibrant American blue fitted vest. Both
              adorned with a modern twist, sunglasses for the hot Seattle summer
              day. Nothing on them says "match day." What they're performing is
              American-ness itself, reflected through costume history, offered up
              as the frame through which their World Cup enthusiasm should be read.
            </p>
            <p class="essay-figure__note">
              Symbolic interactionism helps explain the meaning in the objects that
              aren't immediately inherent. The top hat or the cheesy powered wig
              are items that are produced in the moment of interaction, in how the
              wearer holds themself and how onlookers respond. Identity is
              performed through symbols because of language barriers &rarr; actions
              and symbols speak louder than words. Thousands of people wearing the
              same costumes and colors turn once individual symbols into a
              collective identity.
            </p>
          </figcaption>
        </figure>

        <figure class="essay-figure">
          <img src="Images/Costume_Photo3.jpg" alt="Placeholder photo 3 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 3 — C-01.3 · [location / date]</span>
            <p class="essay-figure__note">
              A woman in a Bosnia and Herzegovina jersey stands with her arm around
              a younger woman wearing a blue wig and a soccer ball sun hat, paired
              with a "BOSNIA 2026" shirt tied around her waist. A child looks on,
              half in frame, half his own small observer of the scene.
            </p>
            <p class="essay-figure__note">
              In Tajfel and Turner's social identity theory: people derive part of
              their self-concept from membership in a group, and they act to
              maintain a positive distinctiveness for that group; for example, a
              national jersey worn proudly in a foreign city is a textbook act of
              in-group affirmation. But what stands out is how drastic the identity
              work is. One woman's team kit is simple, while the other woman's
              homage is looser and closer to costume than uniform. Social identity
              isn't inherited whole; it's translated across generations, each
              person negotiating how much of the symbol to carry and how much to
              reinterpret. The category "Bosnian supporter" holds them together.
            </p>
          </figcaption>
        </figure>

        <figure class="essay-figure">
          <img src="Images/Costume_Photo4.JPG" alt="Placeholder photo 4 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 4 — C-01.4 · [location / date]</span>
            <p class="essay-figure__note">
              A man in a Senegalese national jersey moves through a crowded
              street, with a straw hat called a Fulani, tilted back, one hand
              raising a phone, the other gripping what appears to be the Senagal
              flag caught mid-snap in the wind. His mouth open, mid-shout or
              mid-cheer, impossible to tell which.
            </p>
            <p class="essay-figure__note">
              This is a body doing two things at once: documenting the moment for
              an audience elsewhere (the phone) and declaring group membership to
              the crowd around him (the flag and fulani hat). Interactionlist
              would call this a layered performance. A jack of all trades, per se,
              the man is simultaneously an actor in the scene and its narrator,
              aware that his gesture will be replayed later for people who weren't
              there. The Senegal flag functions as what symbolic interactionists
              call a significant symbol: it carries a shared, recognizable meaning
              that lets a stranger in a crowd of thousands signal "I belong here"
              without a word exchanged.
            </p>
          </figcaption>
        </figure>

        <figure class="essay-figure">
          <img src="Images/Costume_Photo5.JPG" alt="Placeholder photo 5 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 5 — C-01.5 · [location / date]</span>
            <p class="essay-figure__note">
              A man in a Mexican sombrero with "VIVA MEXICO" etched in, covered
              over an American flag pancho or blanket draped over his shoulders,
              homemade wooden and cardboard signage rigged to his body, with a
              phone on a selfie stick to capture it all. Nothing here is
              store-bought fandom. It's authentic, improvised, and load-bearing.
            </p>
          </figcaption>
        </figure>

        <figure class="essay-figure">
          <img src="images/generic-b.svg" alt="Placeholder photo 6 for the Costumes essay">
          <figcaption>
            <span class="essay-figure__num">Fig. 6 — C-01.6 · [location / date]</span>
          </figcaption>
        </figure>

      </div>
    </section>
